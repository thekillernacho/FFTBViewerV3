# Test Configuration
spring.application.name=twitch-chat-reader-test
spring.main.banner-mode=off

# In-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2

# JPA Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Track play test configuration
track.play.enabled=true
track.play.log-only=false
track.play.record-track-plays=true
track.play.update-occurrences=true
track.play.deduplication.seconds=10

# Disable unnecessary components for tests
logging.level.com.twitchchat=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN